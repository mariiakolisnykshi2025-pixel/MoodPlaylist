<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>MoodPlaylist</title>
</head>

<body>
    <header>
        <h1>MoodPlaylist</h1>
        <p>This site will help you generate an ideal playlist for your current mood</p>
    </header>

    <section id="mood-section">
        <h2>Choose your mood</h2>
        <button data-mood="depressed">Depressingly looking out of the window</button>
        <button data-mood="longing">Longing for the beauty of the past</button>
        <button data-mood="epic">Creating epic edits in your head</button>
        <button data-mood="romanticising">Romanticising your life</button>
        <button data-mood="concentrate">Trying to concentrate on your work</button>
        <button data-mood="dancing">Dancing with your soul</button>
        <button data-mood="nostalgic">Feeling nostalgic</button>
        <button data-mood="love">Falling in love</button>
        <button data-mood="trip">Going for a long trip</button>
        <button data-mood="mood">Looking for a specific mood</button>

    </section>



    <section id="genre-section" class="hidden">

       <h2>Select genres for this mood</h2>

        <div class="genre-list">

    <section id="playlist-section" class="hidden">

        <h2>Your playlist is ready!</h2>
        <table>
            <thead>
                <tr>
                    <th>Cover</th>
