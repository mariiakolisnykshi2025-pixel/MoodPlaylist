<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodPlaylist</title>
</head>

<body>
    <header>
        <h1>MoodPlaylist</h1>
        <p>This site will help you generate an ideal playlist for your current mood</p>
    </header>

    <section id="mood-section">
        <h2>Choose your mood</h2>
        <button>Depressingly looking out of the window</button>
        <button>Longing for the beauty of the past</button>
        <button>Creating epic edits in your head</button>
        <button>Romanticising your life</button>
        <button>Trying to concentrate on your work</button>
        <button>Dancing with your soul</button>
        <button>Feeling nostalgic</button>
        <button>Looking for a specific mood</button>

    </section>



    <section id="genre-section">

        <h2>Select genres for this mood</h2>

        <label>
            <input type="checkbox" name="genre" value="synthwave"> Synthwave
        </label>

        <label>
            <input type="checkbox" name="genre" value="rock"> Rock
        </label>

        <label>
            <input type="checkbox" name="genre" value="indie"> Indie
        </label>

        <label>
            <input type="checkbox" name="genre" value="folk"> Folk
        </label>

        <label>
            <input type="checkbox" name="genre" value="pop"> Pop
        </label>

        <label>
            <input type="checkbox" name="genre" value="jazz"> Jazz
        </label>

        <label>
            <input type="checkbox" name="genre" value="instrumental"> Instrumental
        </label>

        <label>
            <input type="checkbox" name="genre" value="classics"> Classics
        </label>

        <label>
            <input type="checkbox" name="genre" value="hip-hop"> Hip-hop
        </label>

        <label>
            <input type="checkbox" name="genre" value="electronic"> Electronic
        </label>

        <button type="button">Generate Playlist</button>
    </section>



    <section id="playlist-section">

        <h2>Your playlist is ready!</h2>
        <table>
            <thead>
                <tr>
                    <th>Cover</th>
                    <th>Track</th>
                    <th>Artist</th>
                    <th>Genre</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>🎵</td>                                 
                    <td>Midnight City</td>                      
                    <td>M83</td>                                
                    <td>Synthwave</td>                          
                    <td><a href="https://youtube.com" target="_blank">Listen on YT</a></td>
                </tr>
            </tbody>


        </table>

    </section>

    <footer>
        <p>Created by <a href="https://github.com/mariiakolisnykshi2025-pixel" target="_blank">Mariia</a></p>
    </footer>

</body>

</html>
